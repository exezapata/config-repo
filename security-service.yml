server:
  port: 8083

spring:
  application:
    name: security-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/security_db}
    username: ${SPRING_DATASOURCE_USERNAME:security_user}
    password: ${SPRING_DATASOURCE_PASSWORD:security_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8088}
      fail-fast: true
    discovery:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: security
    baseline-on-migrate: true
    baseline-version: 1.0.0
    placeholders:
      schema: security
    validate-on-migrate: true
    clean-disabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://registry-service:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: trace
