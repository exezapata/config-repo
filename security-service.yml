server:
  port: 8083
  cloud:
    discovery:
      enabled: true  # Habilita el registro en el servicio de descubrimiento (Eureka)
  flyway:
    locations: classpath:db/migration

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/security_db}
    username: ${SPRING_DATASOURCE_USERNAME:security_user}
    password: ${SPRING_DATASOURCE_PASSWORD:security_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8088}
      fail-fast: true

  security:
    user:
      name: user1
      password: password
    oauth2:
      authorizationserver:
        client:
          user-accounts-app:
            registration:
              client-id: "user-accounts-app"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "http://127.0.0.1:8080/login/oauth2/code/user-accounts-app-oidc"
                - "http://127.0.0.1:8080/authorized"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/logged-out"
              scopes:
                - "openid"
                - "profile"
                - "accounts.read"
                - "accounts.write"
            require-authorization-consent: true

oauth2:
  authorization-server:
    issuer: http://localhost:8083  # URI del issuer para la generación y validación de tokens JWT

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://registry-service:8761/eureka/}  # URL del servidor Eureka

management:
  tracing:
    sampling:
      probability: 1.0  # Muestreo del 100% para trazado distribuido
  health:
    circuitbreakers:
      enabled: true  # Habilita el monitoreo de circuit breakers
  endpoints:
    web:
      exposure:
        include: health  # Expone el endpoint de health
  endpoint:
    health:
      show-details: always  # Muestra detalles completos del health check

flyway:
  enabled: true
  locations: classpath:db/migration
  schemas: security
  baseline-on-migrate: true
  baseline-version: 1.0.0
  placeholders:
    schema: security
  validate-on-migrate: true
  clean-disabled: true

logging:
  level:
    org.springframework.security: trace
