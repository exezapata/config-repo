server:
  port: 8084

eureka:
  client:
    serviceUrl:
      defaultZone: http://registry-service:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

spring:
  cloud:
    discovery:
      enabled: true
